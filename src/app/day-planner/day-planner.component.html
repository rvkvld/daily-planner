<app-add-task (addTaskEvent)="handleNewTask($event)"></app-add-task>

@for(task of tasks; track task.completed){ @if(!task.completed){
<div>
  <button class="task-button" (click)="selectTask(task)" [appHighlight]="task.isDueToday">
    {{task.name}}{{task.time | date: ", MMMM d, yyyy": "EST"}} <br> {{task.name}} at
    {{task.time | timeLeft}}
  </button>
</div>
} }
<h2>Task Details</h2>
@if(selectedTask){
<app-task [task]="selectedTask" (click)="handleCompleteTask()"
  >{{selectedTask.name}}</app-task
>
}
